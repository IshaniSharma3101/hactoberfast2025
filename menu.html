<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Bar Example</title>
  <style>
    /* Reset basic styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Navbar styling */
    nav {
      background-color: #0a192f; /* navy blue shade */
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 60px;
      font-family: "Poppins", sans-serif;
    }

    /* Logo section */
    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Menu items */
    .menu {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .menu li a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: 0.3s;
    }

    .menu li a:hover {
      color: #64ffda; /* teal accent hover */
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }
      .menu {
        flex-direction: column;
        width: 100%;
      }
      .menu li {
        padding: 10px 0;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">EduVault</div>
    <ul class="menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#features">Features</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
